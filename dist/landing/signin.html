<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4F3EF">
  <meta name="description" content="Demo sign-in to your ScrapLoop material exchange workspace.">
  <title>Sign In | ScrapLoop</title>
  <link rel="stylesheet" href="./landing.css">
  <script src="./auth.js" defer></script>
</head>
<body>
  <div class="auth-shell">
    <header class="site-header">
      <a class="wordmark" href="/landing/landing.html" aria-label="ScrapLoop landing page">
        <svg class="wordmark-mark" aria-hidden="true" viewBox="0 0 28 28">
          <path d="M5 8h13l-3-3m8 15H10l3 3"></path>
          <path d="M18 8a8 8 0 0 1 4 12M10 20a8 8 0 0 1-4-12"></path>
        </svg>
        <span>SCRAPLOOP</span>
      </a>
      <a class="auth-header-link" href="/landing/landing.html">BACK TO EXCHANGE</a>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="signin-title">
        <div class="auth-card-header">
          <span class="auth-eyebrow">ACCOUNT ACCESS / LOCAL DEMO</span>
          <h1 id="signin-title">Sign In</h1>
          <p class="auth-subtitle">Open your industrial material exchange and research workspace.</p>
          <p class="auth-demo-note">Demo sign-in · Checks accounts saved on this device only. No passwords are stored.</p>
        </div>

        <!-- Real authentication is future work; this is a demo sign-in using localStorage only (no passwords stored). -->
        <form class="auth-form" id="signin-form" novalidate>
          <p class="auth-form-error" id="signin-form-error" role="alert" hidden></p>

          <div class="auth-field">
            <label class="auth-label" for="signin-email">Work email</label>
            <input class="auth-input" id="signin-email" name="email" type="email" autocomplete="email" placeholder="aarav@facility.in" required aria-describedby="signin-email-error">
            <p class="auth-error" id="signin-email-error" role="alert" hidden></p>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="signin-password">Password</label>
            <div class="auth-input-wrap">
              <input class="auth-input auth-input--password" id="signin-password" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" required aria-describedby="signin-password-error">
              <button class="auth-password-toggle" type="button" data-password-toggle="signin-password" data-show-label="Show password" data-hide-label="Hide password" aria-controls="signin-password" aria-pressed="false" aria-label="Show password">Show</button>
            </div>
            <p class="auth-error" id="signin-password-error" role="alert" hidden></p>
          </div>

          <button class="action-button action-button--primary auth-submit" id="signin-submit" type="submit" data-loading-label="Signing in…">
            <span class="auth-submit-spinner" aria-hidden="true"></span>
            <span class="auth-submit-label">Sign In</span>
          </button>
        </form>

        <footer class="auth-footer">
          <div class="auth-footer-row">
            <span>New to ScrapLoop?</span>
            <a class="auth-switch-link" href="/landing/signup.html">Create Account</a>
          </div>
          <a class="auth-guest-link" href="/">Continue as guest</a>
        </footer>
      </section>
    </main>
  </div>
</body>
</html>
